# Conta de destino do deploy.
#
#   conta      allanaeocom  (allan.em.cristo.jesus@gmail.com)
#   subdomain  allanaeocom.workers.dev
#
# Fixar account_id aqui e a trava principal deste repositorio: havendo varias
# contas Cloudflare no mesmo navegador, sem isso o wrangler pode publicar na
# conta errada sem avisar. scripts/verify-cloudflare-account.mjs le este valor
# como conta esperada, entao a trava vale mesmo sem nenhuma variavel de ambiente.
account_id = "6939ad4db2ec5dc60b8d7c57b7e6faab"

name = "allanaeo"
compatibility_date = "2026-09-29"

# Codigo do Worker: so roda quando nenhum arquivo de public/ casa com a URL
# (assets sao servidos primeiro). Hoje ele faz os 301 da consolidacao de
# 2026-10-07 e devolve 404 para o resto.
main = "src/index.js"

# Dominio proprio. Exige que a zona allanaeo.com esteja nesta mesma conta
# (allanaeocom); no deploy o Cloudflare cria o registro DNS e o certificado.
# Os canonical das paginas apontam para https://allanaeo.com/.
routes = [
  { pattern = "allanaeo.com", custom_domain = true },
]

# Site estatico: o Worker serve so os arquivos de public/, sem codigo proprio.
# Cada pagina e um index.html na sua pasta, servido com barra final (/about/).
# Tabelas TOML ficam por ultimo: chaves abaixo de [assets] pertencem a ela.
[assets]
directory = "./public"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
